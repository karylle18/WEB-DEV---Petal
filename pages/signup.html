<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | Petal</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <link rel="stylesheet" href="../src/css/style.css">
</head>
<body data-page="signup" data-guest="true">
<nav>
  <a class="logo" href="../index.html"><img src="../assets/img/logo.svg" alt="" width="30" height="30">Petal</a>
  <ul>
    <li><a href="about.html">About</a></li>
    <li><a href="privacy.html">Privacy</a></li>
    <li><a href="login.html">Log in</a></li>
    <li><a class="btn" href="signup.html">Sign up</a></li>
  </ul>
</nav>
<main>
  <section class="card">
    <h1>Join Petal</h1>
    <p class="small">No email. No phone number. Just a username and a password.</p>
    <form id="signupForm">
      <label for="name">Display name</label>
      <input id="name" required maxlength="30">
      <label for="username">Username</label>
      <input id="username" required maxlength="20" pattern="[A-Za-z0-9_]+" title="Letters, numbers and underscores only">
      <label for="password">Password (8 or more characters)</label>
      <input id="password" type="password" required minlength="8">
      <p id="message" class="message"></p>
      <button class="btn" type="submit">Create account</button>
    </form>
    <p class="small">Already have an account? <a href="login.html">Log in</a></p>
  </section>
</main>
<footer>Petal 2026 &mdash; a class project by Karylle Lynn L. Dellosa, BS Data Science, USTP</footer>
<script src="../src/js/main.js"></script>
</body>
</html>
