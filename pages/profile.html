<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Petal</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <link rel="stylesheet" href="../src/css/style.css">
</head>
<body data-page="profile" data-private="true">
<nav>
  <a class="logo" href="feed.html"><img src="../assets/img/logo.svg" alt="" width="30" height="30">Petal</a>
  <ul>
    <li><a href="feed.html">Feed</a></li>
    <li><a href="explore.html">Explore</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="settings.html">Settings</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="privacy.html">Privacy</a></li>
    <li><button id="logoutBtn" class="btn btn-light">Log out</button></li>
  </ul>
</nav>
<main>
  <section class="card">
    <div class="post-head">
      <div id="avatar" class="avatar big"></div>
      <div>
        <h1 id="profileName"></h1>
        <p class="small" id="profileUser"></p>
        <p class="small"><span id="postCount">0</span> posts planted</p>
      </div>
    </div>
    <p id="profileBio"></p>
  </section>

  <section class="card">
    <h2>Edit profile</h2>
    <form id="editForm">
      <label for="editName">Display name</label>
      <input id="editName" required maxlength="30">
      <label for="editBio">Bio</label>
      <textarea id="editBio" rows="3" maxlength="150"></textarea>
      <p id="message" class="message"></p>
      <button class="btn" type="submit">Save changes</button>
    </form>
  </section>
</main>
<footer>Petal 2026 &mdash; a class project by Karylle Lynn L. Dellosa, BS Data Science, USTP</footer>
<script src="../src/js/main.js"></script>
</body>
</html>
